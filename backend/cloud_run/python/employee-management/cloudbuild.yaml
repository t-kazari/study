steps:
  # Dockerイメージのビルド (uvキャッシュ利用)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/employee-management-backend:$COMMIT_SHA', '.']

  # Container Registryへのプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/employee-management-backend:$COMMIT_SHA']

  # Cloud Runへのデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'employee-management-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/employee-management-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/employee-management-backend:$COMMIT_SHA'
